name: Build Python Wheel

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-sdist:
    name: Build python sdist
    runs-on: ubuntu-latest

    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: |
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*
  build-wheel:
    name: Build python wheel
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform:
          - musllinux_1_2_x86_64
          - manylinux_2_28_x86_64
        python: ["3.10", "3.11", "3.12"]

    container:
      image: quay.io/pypa/${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheel
        run: |
          python${{ matrix.python }} -m build --wheel

      - name: Repair wheel with auditwheel
        run: |
          auditwheel repair *.whl --wheel-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.python }}-${{ matrix.platform }}
          path: ./wheelhouse/*

  deploy-gh:
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-latest
    environment:
      name: github
      url: https://github.com/mjsir911/dectalk.py/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "*"
          merge-multiple: true
      - name: Upload wheel to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pypi:
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dectalk/
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "*"
          merge-multiple: true
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
